[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handball"
version = "0.0.1"
description = "Shot statistics from amateur handball video with a local open-source VLM"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["flake8", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handball = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
