name: handball
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - transformers
      - accelerate
      - bitsandbytes
      - qwen-vl-utils
      - opencv-python
      - pandas
      - num2words  # SmolVLM processor
      - pyvips[binary]  # Moondream2 remote code
      - einops  # Moondream2 remote code
      - -e .[dev]
